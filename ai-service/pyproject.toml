[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RollandRakotondranisa", email = "rollandrakotondranisa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ai-service = "ai_service:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
